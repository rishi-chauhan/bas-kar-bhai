<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bas Kar Bhai!</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="backdrop"></div>
  <main class="stage" role="alertdialog" aria-labelledby="title" aria-describedby="stats">
    <div class="tape"></div>
    <div class="inner">
      <h1 id="title">
        <span class="en">BAS KAR BHAI!</span>
        <span class="hi" lang="hi">बस कर भाई!</span>
      </h1>
      <div class="screen" id="screen">
        <video id="video" playsinline preload="auto"></video>
        <div class="sound-hint" id="soundHint" hidden>🔊 sound playing in the background</div>
      </div>
      <p id="stats" class="stats"></p>
      <div class="actions">
        <button id="closeTab" class="danger">Close this tab, I'm going to work</button>
        <button id="snooze" class="ghost" disabled>5 min aur, please 🙏</button>
      </div>
      <p class="fine" id="fine">Wait for the video to finish if you want to beg for more time.</p>
    </div>
    <div class="tape"></div>
  </main>
  <script type="module" src="overlay.js"></script>
</body>
</html>
