name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Branded Google Chrome (preinstalled on the runner) ignores --load-extension,
      # so the browser tests use Chrome for Testing instead.
      - name: Install Chrome for Testing
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "CHROME_PATH=$(echo "$out" | tail -n1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm test
