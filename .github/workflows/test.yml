name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Branded Google Chrome (preinstalled on the runner) ignores --load-extension,
      # so the browser tests use Chrome for Testing instead.
      - name: Install Chrome for Testing
        if: matrix.browser == 'chrome'
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "CHROME_PATH=$(echo "$out" | tail -n1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: |
          out=$(npx --yes @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/browsers")
          echo "$out"
          echo "FIREFOX_PATH=$(echo "$out" | tail -n1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      # On Linux, Firefox plays H.264/AAC (the bundled clip) through the
      # system's ffmpeg libraries, which the runner doesn't have.
      - name: Install video codecs for Firefox
        if: matrix.browser == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Ubuntu 24.04 blocks the unprivileged user namespaces the browsers' sandboxes need.
      - name: Allow the browser sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm test

      - name: Lint for Firefox Add-ons
        if: matrix.browser == 'firefox'
        run: npm run lint:firefox
